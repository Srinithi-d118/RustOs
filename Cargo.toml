[package]
name = "rust_os"
version = "0.1.0"
edition = "2024"
authors = ["RustOS Engineering Team"]

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.9.9"
x86_64 = { version = "0.14.13", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
pic8259 = "0.10.4"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.6"
uart_16550 = "0.2.19"

[[bin]]
name = "rust_os"
test = false
bench = false